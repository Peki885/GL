<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Have a nice day~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Load web fonts without blocking the first paint: where Google Fonts is unreachable
     (e.g. mainland China) the page shows right away in the device's own fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap"></noscript>
<style>
:root {
  --bg: #FFF9F3;
  --surface: #FFFFFF;
  --surface-2: #FBEFE6;
  --ink: #2F2A3B;
  --ink-2: #6C6479;
  --ink-3: #A39AAF;
  --line: #F1E4DA;
  --anchor: #3CC6A8;
  --anchor-ink: #148A72;
  --anchor-soft: #D9F6EE;
  --on-anchor: #0D3B32;
  --flex: #F2A230;
  --flex-ink: #B26A00;
  --blank-ink: #6A58C9;
  --flex-soft: #FFF0CC;
  --blank: #8F7FE0;
  --blank-soft: #EFEBFF;
  --accent: #FF7A66;
  --good: #2FA35E;
  --bad: #E0584A;
  --c0: #3CC6A8;
  --c1: #6CCB5F;
  --c2: #4FA9F2;
  --c3: #F173B3;
  --c4: #F5B731;
  --c5: #FF7A66;
  --glow-1: rgba(255, 198, 120, .38);
  --glow-2: rgba(120, 220, 200, .30);
  --glow-3: rgba(190, 170, 255, .26);
  --scrim: rgba(60, 40, 70, .30);
  --shadow: 0 10px 40px rgba(120, 80, 60, .16);
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1B1928; --surface: #26233A; --surface-2: #312D48; --ink: #F3EFFA; --ink-2: #B9B1CC; --ink-3: #807897; --line: #37324F;
    --anchor: #4FD8BA; --anchor-ink: #6BE3C8; --anchor-soft: #1F3E3E; --on-anchor: #0B2E27;
    --flex: #FFC065; --flex-ink: #FFC065; --blank-ink: #C4B8FF; --flex-soft: #43341F; --blank: #B6A8FF; --blank-soft: #2F2A4D;
    --accent: #FF9484; --good: #7ADB9C; --bad: #FF8C7E;
    --c0: #4FD8BA; --c1: #8EDC80; --c2: #7CC1FF; --c3: #FF9ACB; --c4: #FFCB5C; --c5: #FF9484;
    --glow-1: rgba(255, 170, 90, .14); --glow-2: rgba(80, 220, 190, .12); --glow-3: rgba(170, 140, 255, .16);
    --scrim: rgba(5, 3, 15, .55);
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1B1928; --surface: #26233A; --surface-2: #312D48; --ink: #F3EFFA; --ink-2: #B9B1CC; --ink-3: #807897; --line: #37324F;
  --anchor: #4FD8BA; --anchor-ink: #6BE3C8; --anchor-soft: #1F3E3E; --on-anchor: #0B2E27;
  --flex: #FFC065; --flex-ink: #FFC065; --blank-ink: #C4B8FF; --flex-soft: #43341F; --blank: #B6A8FF; --blank-soft: #2F2A4D;
  --accent: #FF9484; --good: #7ADB9C; --bad: #FF8C7E;
  --c0: #4FD8BA; --c1: #8EDC80; --c2: #7CC1FF; --c3: #FF9ACB; --c4: #FFCB5C; --c5: #FF9484;
  --glow-1: rgba(255, 170, 90, .14); --glow-2: rgba(80, 220, 190, .12); --glow-3: rgba(170, 140, 255, .16);
  --scrim: rgba(5, 3, 15, .55);
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  background-image:
    radial-gradient(60% 40% at 0% 0%, var(--glow-1), transparent 70%),
    radial-gradient(50% 35% at 100% 5%, var(--glow-2), transparent 70%),
    radial-gradient(60% 40% at 50% 100%, var(--glow-3), transparent 70%);
  background-attachment: fixed;
  min-height: 100vh;
}
body {
  margin: 0;
  color: var(--ink);
  font: 15px/1.6 var(--sans);
  padding-inline: 16px;
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--anchor); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; }

/* ---------- header ---------- */
.top { padding-block: 22px 14px; display: grid; gap: 4px; }
.brand { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.brand-name { font: 900 16px/1.2 var(--serif); letter-spacing: .01em; color: var(--accent); white-space: nowrap; }
.brand-sub { font: 400 12px/1 var(--mono); color: var(--ink-3); letter-spacing: .04em; }
.week-nav { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.week-title { font: 600 clamp(24px, 6.4vw, 32px)/1.2 var(--serif); margin: 0; flex: 1; text-wrap: balance; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.icon-btn:hover { border-color: var(--ink-3); }
.pill-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; color: var(--ink-2);
}
.week-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 13px; }
.week-meta b { font: 500 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- banners ---------- */
.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px;
}
.banner.sample { background: var(--blank-soft); color: var(--ink); }
.banner.plan { background: var(--flex-soft); }
.banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.banner button {
  border: 0; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500;
  background: var(--surface); color: var(--ink);
}

/* ---------- week ---------- */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 2px 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.anchor { background: var(--anchor); }
.sw.flex { background: var(--flex-soft); border: 1.5px solid var(--flex); }
.sw.blank { border: 1.5px dashed var(--blank); }

.days { display: grid; gap: 0; border-top: 1px solid var(--line); }
.day {
  display: grid; grid-template-columns: 64px 1fr; gap: 12px;
  padding-block: 14px; border-bottom: 1px solid var(--line); align-items: start;
}
.day.today { background: linear-gradient(90deg, var(--anchor-soft), transparent 70%); margin-inline: -16px; padding-inline: 16px; }
.day-label { display: grid; gap: 0; padding-top: 3px; }
.day-name { font: 600 16px/1.2 var(--serif); }
.day-date { font: 400 12px/1.4 var(--mono); color: var(--ink-3); }
.day.today .day-name { color: var(--anchor-ink); }
.day.today .day-date::after { content: "今天"; display: block; font: 500 11px/1.4 var(--sans); color: var(--anchor-ink); letter-spacing: .08em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
  border-radius: 10px; padding: 7px 12px; font-size: 14px; line-height: 1.35; text-align: left;
  border: 1.5px solid transparent;
}
.chip-name { overflow-wrap: anywhere; }
.chip.k-anchor { background: var(--anchor); color: var(--on-anchor); font-weight: 500; }
.chip.k-flex { background: var(--flex-soft); border-color: var(--flex); color: var(--ink); }
.chip.k-flex.empty { background: var(--surface); border-style: dashed; color: var(--flex-ink); }
.chip.k-blank { background: var(--blank-soft); border: 1.5px dashed var(--blank); color: var(--blank-ink); }
.chip-score {
  font: 500 12px/1 var(--mono); border-radius: 999px; padding: 3px 7px;
  background: var(--surface); color: var(--ink);
}
.chip.k-anchor .chip-score { background: var(--surface); color: var(--anchor-ink); }
.chip.k-flex.empty::before { content: "+"; font-weight: 700; }
.add-chip {
  width: 34px; height: 34px; border-radius: 10px; border: 1.5px dashed var(--line);
  background: transparent; color: var(--ink-3); font-size: 18px; line-height: 1;
}
.add-chip:hover { border-color: var(--ink-3); color: var(--ink); }

/* ---------- sections ---------- */
.section { margin-top: 26px; display: grid; gap: 10px; }
.section h2 { font: 600 20px/1.3 var(--serif); margin: 0; }
.section h3 { font: 500 12px/1.4 var(--sans); margin: 0; letter-spacing: .12em; color: var(--ink-2); }
.lead { color: var(--ink-2); margin: 0; max-width: 60ch; font-size: 14px; }
.card { background: var(--surface); border-radius: 14px; padding: 4px 16px; }

.cat-head { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.row {
  display: flex; align-items: center; gap: 12px; padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: none; max-width: 50%; }
.row-title { overflow-wrap: anywhere; }
.row-sub { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row-sub .mono { font-family: var(--mono); }
.ghost {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 5px 12px; font-size: 13px; color: var(--ink-2); flex: none;
}
.ghost:hover { color: var(--ink); border-color: var(--ink-3); }
.ghost.armed { border-color: var(--bad); color: var(--bad); }
.ghost.go { border-color: var(--anchor); color: var(--anchor-ink); }

.add-form { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
@media (max-width: 460px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form input { grid-column: 1 / -1; } }
.field {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 9px 12px; min-width: 0; width: 100%;
}
.primary {
  border: 0; background: var(--anchor); color: var(--on-anchor); font-weight: 700; border-radius: 10px;
  padding: 9px 18px; font-weight: 500;
}
.danger-link { border: 0; background: transparent; color: var(--bad); padding: 9px 4px; font-size: 14px; }

.nav-row {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
}
.nav-row:hover { border-color: var(--anchor); }
.nav-row-main { flex: 1; display: grid; gap: 2px; }
.nav-row-title { font: 600 16px/1.3 var(--serif); }
.nav-row-chev { font-size: 22px; line-height: 1; color: var(--ink-3); }
.back-btn { border: 0; background: transparent; padding: 4px 0; color: var(--anchor-ink); font-size: 15px; font-weight: 500; }

/* ---------- account ---------- */
.brand-right { display: flex; align-items: center; gap: 10px; }
.acct {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--ink-2); line-height: 1.4;
}
.acct:hover { border-color: var(--anchor); }
.sync-slot { display: inline-flex; align-items: center; gap: 6px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; display: inline-block; }
.sync-dot.ok { background: var(--good); }
.sync-dot.busy { background: var(--flex); }
.sync-dot.err { background: var(--bad); }
.auth-card { background: var(--surface); border-radius: 16px; padding: 18px 16px; display: grid; gap: 12px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 500;
}
.google-btn:hover { border-color: var(--anchor); }
.google-btn .g { font: 700 16px/1 var(--sans); color: var(--c2); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth-form { display: grid; gap: 10px; }
.auth-form .primary { width: 100%; padding: 11px 18px; }
.primary[disabled], .google-btn[disabled] { opacity: .55; cursor: default; }
.error-line { color: var(--bad); font-size: 13px; margin: 0; }
.link-btn { border: 0; background: transparent; padding: 0; color: var(--anchor-ink); font-size: 13px; justify-self: start; }
.kv { display: grid; gap: 2px; }
.kv b { font-weight: 500; overflow-wrap: anywhere; }
.choice { display: grid; gap: 8px; }
.choice .nav-row { padding: 12px 14px; }

/* ---------- review ---------- */
.stat-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font: 500 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-2); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--anchor); border-radius: 3px; }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--surface-2); }
.pips i.on { background: var(--ink-2); }
.pips.hi i.on { background: var(--good); }
.pips.lo i.on { background: var(--bad); }
.avg { font: 500 18px/1 var(--mono); font-variant-numeric: tabular-nums; width: 2.4em; text-align: right; flex: none; }
.verdict { font-size: 12px; border-radius: 999px; padding: 2px 9px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.verdict.hi { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.verdict.lo { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.quote { padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.quote:last-child { border-bottom: 0; }
.quote p { margin: 0; font-family: var(--serif); font-weight: 600; }
.quote .row-sub { display: flex; gap: 8px; flex-wrap: wrap; }
.empty-state { color: var(--ink-3); padding-block: 18px; font-size: 14px; }

/* ---------- tabbar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabbar-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab {
  border: 0; background: transparent; padding: 8px 4px; border-radius: 10px;
  display: grid; justify-items: center; gap: 3px; color: var(--ink-3); font-size: 12px;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--anchor-ink); background: var(--anchor-soft); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 18px; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sheet-head h2 { font: 600 20px/1.3 var(--serif); margin: 0; }
.sheet-head .row-sub { font-family: var(--mono); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg-hint { font-size: 12px; color: var(--ink-3); margin: -10px 0 0; }
.block { display: grid; gap: 10px; }
.label { font-size: 13px; color: var(--ink-2); }
.current-act { font: 600 19px/1.4 var(--serif); }
.current-act.none { color: var(--ink-3); font-family: var(--sans); font-weight: 400; font-size: 15px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.picker { display: grid; gap: 4px; max-height: 42vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.picker .cat-head { margin: 8px 0 2px; font-size: 12px; color: var(--ink-2); letter-spacing: .08em; }
.pick {
  border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px;
  display: flex; gap: 8px; justify-content: space-between; align-items: center;
}
.pick:hover { background: var(--surface-2); }
.pick[aria-pressed="true"] { background: var(--anchor-soft); color: var(--anchor-ink); font-weight: 500; }
.add-pick { color: var(--anchor-ink); font-weight: 500; }
.new-anchor { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; }
.pick small { font: 400 11px var(--mono); color: var(--ink-3); white-space: nowrap; }
.scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.score {
  border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 10px 0 6px;
  display: grid; justify-items: center; gap: 0;
}
.score b { font: 500 20px/1 var(--mono); }
.score span { font-size: 11px; color: var(--ink-3); min-height: 1.4em; }
.score[aria-pressed="true"] { border-color: var(--anchor); background: var(--anchor); color: var(--on-anchor); }
.score[aria-pressed="true"] span { color: var(--on-anchor); }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-grid button { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 10px 0; font-family: var(--serif); font-weight: 600; }
.day-grid button:hover { border-color: var(--anchor); color: var(--anchor-ink); }

textarea.field { min-height: 110px; font: 12px/1.5 var(--mono); resize: vertical; }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 30;
  max-width: calc(100vw - 32px); text-align: center;
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" aria-label="主导航">
  <div class="tabbar-in">
    <button class="tab" data-tab="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>本周</button>
    <button class="tab" data-tab="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>菜单</button>
    <button class="tab" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>回顾</button>
    <button class="tab" data-tab="rhythm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="7" r="3"/><path d="M12 10v11M6 15c0 3 3 6 6 6s6-3 6-6"/></svg>节奏</button>
  </div>
</nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(() => {
  "use strict";

  /* ================= constants ================= */
  const STORE_KEY = "anchor-blank-v1";
  const THEME_KEY = "anchor-blank-theme";
  const THEMES = { auto: "跟随系统", light: "浅色", dark: "深色" };
  const FIREBASE_VERSION = "12.18.0";
  // These values identify the Firebase project; they are public by design.
  // Access to each user's data is enforced by the Firestore security rules.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBLYcDURxKoVulwjm1Hya89w6ypoM5rwnY",
    authDomain: "hand-6ee5e.firebaseapp.com",
    projectId: "hand-6ee5e",
    storageBucket: "hand-6ee5e.firebasestorage.app",
    messagingSenderId: "363381244348",
    appId: "1:363381244348:web:0460cce45fe853ae406bb9",
  };
  const DAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const KINDS = { anchor: "锚点", flex: "弹性", blank: "留白" };
  const KIND_HINT = {
    anchor: "每周固定在这天做，给生活一个节奏感。锚点不宜多。",
    flex: "从菜单里按心情和天气挑一个。",
    blank: "什么都不安排。留白也可以打分：空着的这晚感觉如何？",
  };
  const CATS = [
    { id: "rhythm", name: "日常节奏", color: "var(--c0)" },
    { id: "senses", name: "滋养感官", color: "var(--c1)" },
    { id: "city", name: "探索城市", color: "var(--c2)" },
    { id: "create", name: "创造与输出", color: "var(--c3)" },
    { id: "joy", name: "纯粹快乐", color: "var(--c4)" },
    { id: "connect", name: "连接", color: "var(--c5)" },
  ];
  const SCORE_WORDS = ["", "没感觉", "还行", "不错", "开心", "超开心"];
  const DEFAULT_ACTS = [
    ["gym", "健身", "rhythm"],
    ["movie", "Movie Night", "rhythm"],
    ["brunch", "慢早餐 + 5 分钟规划下周", "rhythm"],
    ["market", "逛 Jean-Talon 市场，买一样没吃过的", "senses"],
    ["bath", "泡澡 / 护肤夜，配一杯热饮", "senses"],
    ["cafe", "探一家新咖啡馆，全程法语点单", "city"],
    ["royal", "走一条没走过的路上 Mont-Royal", "city"],
    ["books", "独立书店或图书馆分馆随便翻翻", "city"],
    ["digest", "读书消化日：整理笔记，写一段想法", "create"],
    ["trip", "云旅行规划夜（香港 / 苏州）", "create"],
    ["translate", "翻译一小段喜欢的作品", "create"],
    ["otome", "乙女游戏夜 + 一杯奶茶", "joy"],
    ["theme", "主题电影夜（宫崎骏月 / 法语电影月）", "joy"],
    ["meet", "约一个人吃饭或散步", "connect"],
    ["call", "给远方的家人朋友打一通不赶时间的电话", "connect"],
  ];
  const DEFAULT_TEMPLATE = [
    [{ kind: "blank" }],
    [{ kind: "anchor", act: "gym" }],
    [{ kind: "flex" }],
    [{ kind: "anchor", act: "gym" }],
    [{ kind: "anchor", act: "movie" }],
    [{ kind: "flex" }],
    [{ kind: "anchor", act: "brunch" }],
  ];

  /* ================= dates ================= */
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const todayKey = () => keyOf(new Date());
  const thisWeekKey = () => keyOf(mondayOf(new Date()));
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const weeksBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / (7 * 864e5));

  /* ================= utils ================= */
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const avgOf = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

  /* ================= state ================= */
  let state = load();
  let ui = { tab: "week", week: thisWeekKey(), armed: null, sheet: null, backup: "", theme: loadTheme(),
    prevTab: "week", authMode: "login", authEmail: "", authPass: "", authError: "", authBusy: false };
  applyTheme(ui.theme);
  const hashTab = (location.hash || "").slice(1);
  if (["week", "menu", "review", "rhythm", "settings", "account"].includes(hashTab)) ui.tab = hashTab;

  function loadTheme() {
    try { const t = localStorage.getItem(THEME_KEY); if (t in THEMES) return t; } catch (e) { /* ignore */ }
    return "auto";
  }
  function applyTheme(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  function freshState() {
    return {
      v: 1,
      acts: DEFAULT_ACTS.map(([id, name, cat]) => ({ id, name, cat, hidden: false, anchor: cat === "rhythm" })),
      template: clone(DEFAULT_TEMPLATE),
      weeks: {},
      sampleWeeks: [],
    };
  }
  // Older saves have no anchor flag: anchors were the 日常节奏 items plus anything used as an anchor in the template.
  function normalize(s) {
    s.sampleWeeks = s.sampleWeeks || [];
    const tplAnchors = new Set(s.template.flat().filter((t) => t.kind === "anchor" && t.act).map((t) => t.act));
    s.acts.forEach((a) => { if (a.anchor === undefined) a.anchor = a.cat === "rhythm" || tplAnchors.has(a.id); });
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.acts && s.template && s.weeks) return normalize(s);
      }
    } catch (e) { /* storage unavailable */ }
    const s = freshState();
    seedSample(s);
    return s;
  }
  // touch = a real change by the person (bumps updatedAt and syncs to the cloud)
  function save(touch = true) {
    if (touch) state.updatedAt = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    if (touch) cloud.schedulePush();
  }

  function fromTemplate(tpl) {
    return tpl.map((day) => day.map((t) => ({ id: uid(), kind: t.kind, act: t.act || null, score: null, note: "" })));
  }
  function ensureWeek(k) {
    if (!state.weeks[k]) { state.weeks[k] = { days: fromTemplate(state.template) }; save(false); }
    return state.weeks[k];
  }
  const actById = (id) => state.acts.find((a) => a.id === id);
  const catById = (id) => CATS.find((c) => c.id === id) || CATS[0];
  function entryLabel(e) {
    if (e.kind === "blank") return "留白";
    if (!e.act) return e.kind === "flex" ? "挑一个" : "锚点";
    return actById(e.act)?.name ?? "（已删除）";
  }

  function seedSample(s) {
    const mon = mondayOf(new Date());
    const plans = [
      { off: -2, picks: { 2: "cafe", 5: "royal" }, scores: [
        [3, "不太习惯空着，但睡得很早"], [4, "出了汗，整个人轻了"], [4, "学到一句 « pantoute »"],
        [3, "有点累，还是去了"], [5, "又看了一遍《千与千寻》"], [4, "秋天的山真好看"], [5, "阳光和可颂，完美"]] },
      { off: -1, picks: { 2: "bath", 5: "meet" }, scores: [
        [4, "什么都不做，反而很放松"], [4, "深蹲加了重量"], [2, "有点无聊，一直在刷手机"],
        [4, ""], [5, "决定这个月只看宫崎骏"], [5, "和朋友聊了三个小时"], [4, "第一次做班尼迪克蛋"]] },
    ];
    s.sampleWeeks = [];
    for (const p of plans) {
      const k = keyOf(addDays(mon, p.off * 7));
      const days = fromTemplate(s.template);
      days.forEach((d, i) => {
        const e = d[0];
        if (p.picks[i]) e.act = p.picks[i];
        [e.score, e.note] = p.scores[i];
      });
      s.weeks[k] = { days };
      s.sampleWeeks.push(k);
    }
  }

  /* ================= stats ================= */
  function collect() {
    const map = new Map();
    const notes = [];
    const scoredWeeks = new Set();
    let total = 0;
    for (const [wk, w] of Object.entries(state.weeks)) {
      const mon = parseKey(wk);
      w.days.forEach((day, i) => day.forEach((e) => {
        if (!e.score) return;
        const key = e.kind === "blank" ? "__blank" : e.act;
        if (!key) return;
        const date = addDays(mon, i);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(e.score);
        scoredWeeks.add(wk);
        total++;
        if (e.note) notes.push({ date, text: e.note, score: e.score, name: entryLabel(e) });
      }));
    }
    notes.sort((a, b) => b.date - a.date);
    return { map, notes, weeks: scoredWeeks.size, total };
  }
  function actStats(map, id) {
    const arr = map.get(id) || [];
    return { n: arr.length, avg: avgOf(arr) };
  }
  function verdictOf(n, avg) {
    if (n < 2) return { cls: "", text: "再试试" };
    if (avg >= 4) return { cls: "hi", text: "留下" };
    if (avg <= 2.5) return { cls: "lo", text: "可以删掉" };
    return { cls: "", text: "看情况" };
  }
  const anchorActs = () => state.acts.filter((a) => a.anchor && !a.hidden);
  const menuActs = () => state.acts.filter((a) => !a.anchor && !a.hidden);
  const isTemplateAnchor = (id) => state.template.some((d) => d.some((t) => t.kind === "anchor" && t.act === id));

  /* ================= render ================= */
  const $app = document.getElementById("app");
  const $sheet = document.getElementById("sheet");
  const $toast = document.getElementById("toast");

  function render() {
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === navTab() ? "page" : "false"));
    $app.innerHTML = ({ week: viewWeek, menu: viewMenu, review: viewReview, rhythm: viewRhythm, settings: viewSettings, account: viewAccount })[ui.tab]();
    renderSheet();
  }

  function navTab() {
    if (ui.tab === "settings") return "rhythm";
    if (ui.tab === "account") return ui.prevTab === "settings" ? "rhythm" : ui.prevTab;
    return ui.tab;
  }

  function acctButton() {
    return `<button class="acct" data-act="open-account">${cloud.user ? syncBadge() : "登录 · 云端同步"}</button>`;
  }
  function syncBadge() {
    const [cls, text] = cloud.statusView();
    return `<span class="sync-slot"><i class="sync-dot ${cls}"></i>${esc(text)}</span>`;
  }

  function header(title, sub) {
    return `<header class="top">
      <div class="brand"><span class="brand-name">Have a nice day~</span><span class="brand-right"><span class="brand-sub">${esc(sub || "")}</span>${acctButton()}</span></div>
      ${title}
    </header>`;
  }

  function viewWeek() {
    const k = ui.week;
    const w = ensureWeek(k);
    const mon = parseKey(k);
    const sun = addDays(mon, 6);
    const isNow = k === thisWeekKey();
    const started = Object.keys(state.weeks).filter((wk) => state.weeks[wk].days.some((d) => d.some((e) => e.score)));
    const first = [...started, thisWeekKey()].sort()[0];
    const nth = weeksBetween(first, k) + 1;
    const all = w.days.flat();
    const rated = all.filter((e) => e.score);
    const unpicked = [];
    w.days.forEach((d, i) => d.forEach((e, j) => { if (e.kind === "flex" && !e.act) unpicked.push([i, j]); }));
    const tk = todayKey();
    const label = `${mon.getMonth() + 1}月${mon.getDate()}日 – ${sun.getMonth() !== mon.getMonth() ? (sun.getMonth() + 1) + "月" : ""}${sun.getDate()}日`;

    let html = header(`
      <div class="week-nav">
        <h1 class="week-title">${label}</h1>
        ${isNow ? "" : `<button class="pill-btn" data-act="week-now">回到本周</button>`}
        <button class="icon-btn" data-act="week-prev" aria-label="上一周">‹</button>
        <button class="icon-btn" data-act="week-next" aria-label="下一周">›</button>
      </div>
      <div class="week-meta">
        <span>已打分 <b>${rated.length}/${all.length}</b></span>
        <span>本周均分 <b>${rated.length ? avgOf(rated.map((e) => e.score)).toFixed(1) : "–"}</b></span>
      </div>`, nth >= 1 ? `记录第 ${nth} 周` : "");

    if (cloud.conflict) {
      html += `<div class="banner plan"><span>云端和这台设备上各有一份记录，选一份保留吧</span>
        <div class="actions"><button data-act="open-account">去选择</button></div></div>`;
    }
    if (state.sampleWeeks.length) {
      html += `<div class="banner sample"><span>前两周是<b>示例记录</b>，让你先看看「回顾」长什么样。</span>
        <div class="actions"><button data-act="clear-sample">清除示例，开始我的记录</button></div></div>`;
    }
    if (unpicked.length) {
      html += `<div class="banner plan"><span>还有 <b>${unpicked.length}</b> 个弹性时段没挑 · 花 5 分钟规划一下</span>
        <div class="actions"><button data-act="open-entry" data-day="${unpicked[0][0]}" data-idx="${unpicked[0][1]}">开始挑</button></div></div>`;
    } else if (isNow && new Date().getDay() === 0) {
      html += `<div class="banner plan"><span>周日啦，给下周挑挑弹性活动吧</span>
        <div class="actions"><button data-act="week-next">规划下周 →</button></div></div>`;
    }

    html += `<div class="legend"><span><i class="sw anchor"></i>锚点</span><span><i class="sw flex"></i>弹性</span><span><i class="sw blank"></i>留白</span><span>数字 = 做完后的开心分</span></div>`;
    html += `<div class="days">`;
    w.days.forEach((d, i) => {
      const date = addDays(mon, i);
      html += `<div class="day ${keyOf(date) === tk ? "today" : ""}">
        <div class="day-label"><span class="day-name">${DAYS[i]}</span><span class="day-date">${md(date)}</span></div>
        <div class="chips">
          ${d.map((e, j) => chip(e, `data-act="open-entry" data-day="${i}" data-idx="${j}"`, true)).join("")}
          <button class="add-chip" data-act="add-entry" data-day="${i}" aria-label="给${DAYS[i]}加一项">+</button>
        </div>
      </div>`;
    });
    html += `</div>`;
    return html;
  }

  function chip(e, attrs, withScore) {
    const empty = e.kind === "flex" && !e.act ? "empty" : "";
    const sc = withScore && e.score ? `<span class="chip-score" aria-label="${e.score} 分">${e.score}</span>` : "";
    return `<button class="chip k-${e.kind} ${empty}" ${attrs}><span class="chip-name">${esc(entryLabel(e))}</span>${sc}</button>`;
  }

  function viewMenu() {
    const { map } = collect();
    let html = header(`<h1 class="week-title">我的生活菜单</h1>
      <p class="lead">一份只属于你的清单，活出你想要的人生吧。</p>`, `${state.acts.filter((a) => !a.hidden).length} 项`);
    const row = (a, extra = "") => {
      const s = actStats(map, a.id);
      const armed = ui.armed === "hide:" + a.id;
      return `<div class="row"><div class="row-main"><div class="row-title">${esc(a.name)}</div>
        <div class="row-sub">${s.n ? `做过 <span class="mono">${s.n}</span> 次 · 均分 <span class="mono">${s.avg.toFixed(1)}</span>` : "还没试过"}${a.anchor ? " · 已是锚点" : ""}</div></div>
        <div class="row-actions">${extra}<button class="ghost ${armed ? "armed" : ""}" data-act="hide-act" data-id="${a.id}">${armed ? "确认删除" : "删除"}</button></div></div>`;
    };
    for (const c of CATS) {
      const items = state.acts.filter((a) => a.cat === c.id && !a.hidden);
      html += `<section class="section"><div class="cat-head"><i class="dot" style="background:${c.color}"></i><h3>${c.name}</h3></div><div class="card">`;
      if (!items.length) html += `<div class="empty-state">这一类还空着。</div>`;
      // items promoted from another category can be turned back into plain menu items
      for (const a of items) html += row(a, a.anchor
        ? `<button class="ghost" data-act="unanchor" data-id="${a.id}">取消锚点</button>`
        : `<button class="ghost go" data-act="make-anchor" data-id="${a.id}">设为锚点</button>`);
      html += `</div></section>`;
    }
    html += `<section class="section"><h2>加一件新的事</h2>
      <form class="add-form" id="add-form">
        <input class="field" id="new-act-name" placeholder="比如：去植物园画速写" maxlength="60" required>
        <select class="field" id="new-act-cat">${CATS.map((c) => `<option value="${c.id}" ${c.id === "joy" ? "selected" : ""}>${c.name}</option>`).join("")}</select>
        <button class="primary" type="submit">添加</button>
      </form></section>`;
    const hidden = state.acts.filter((a) => a.hidden);
    if (hidden.length) {
      html += `<section class="section"><h3>已删除 · 可以找回</h3><div class="card">${hidden.map((a) => `
        <div class="row"><div class="row-main"><div class="row-title">${esc(a.name)}</div></div>
        <button class="ghost" data-act="restore-act" data-id="${a.id}">找回</button></div>`).join("")}</div></section>`;
    }
    return html;
  }

  function viewReview() {
    const { map, notes, weeks, total } = collect();
    const allScores = [...map.values()].flat();
    const target = 4;
    let html = header(`<h1 class="week-title">我的生活回顾</h1>
      <p class="lead">坚持 3–4 周后回头看：高分的留下或升级为锚点，低分的直接删掉。</p>`, "回顾");
    html += `<div class="stat-strip">
      <div class="stat"><b>${weeks}</b><span>记录的周数</span></div>
      <div class="stat"><b>${total}</b><span>打分次数</span></div>
      <div class="stat"><b>${allScores.length ? avgOf(allScores).toFixed(1) : "–"}</b><span>总体均分</span></div>
    </div>`;
    html += `<div class="section" style="margin-top:14px"><div class="progress" aria-label="回顾进度"><i style="width:${Math.min(100, (weeks / target) * 100)}%"></i></div>
      <p class="lead">${weeks >= 3 ? "数据够了，可以认真筛一轮了。" : `再记录 ${3 - weeks} 周，结论会更可靠。现在的判断先当参考。`}</p></div>`;

    const rows = [...map.keys()].map((id) => {
      const s = actStats(map, id);
      const a = id === "__blank" ? { id, name: "留白", cat: null } : (actById(id) || { id, name: "（已删除）", cat: null });
      return { a, ...s };
    }).sort((x, y) => y.avg - x.avg || y.n - x.n);

    html += `<section class="section"><h2>按开心程度排序</h2><div class="card">`;
    if (!rows.length) html += `<div class="empty-state">还没有打分。在「本周」里点开一项，做完之后打个分就行。</div>`;
    for (const r of rows) {
      const v = verdictOf(r.n, r.avg);
      const color = r.a.cat ? catById(r.a.cat).color : "var(--blank)";
      const rounded = Math.round(r.avg);
      let action = "";
      if (r.a.id !== "__blank" && actById(r.a.id)) {
        if (v.cls === "hi" && !actById(r.a.id).anchor && !isTemplateAnchor(r.a.id)) action = `<button class="ghost go" data-act="promote" data-id="${r.a.id}">设为锚点</button>`;
        else if (v.cls === "lo" && !actById(r.a.id).hidden) {
          const armed = ui.armed === "hide:" + r.a.id;
          action = `<button class="ghost ${armed ? "armed" : ""}" data-act="hide-act" data-id="${r.a.id}">${armed ? "确认删除" : "删掉"}</button>`;
        }
      }
      html += `<div class="row">
        <span class="avg">${r.avg.toFixed(1)}</span>
        <div class="row-main">
          <div class="row-title"><i class="dot" style="background:${color};margin-right:6px"></i>${esc(r.a.name)}</div>
          <div class="row-sub"><span class="pips ${v.cls}">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= rounded ? "on" : ""}"></i>`).join("")}</span>
            &nbsp;<span class="mono">${r.n}</span> 次 &nbsp;<span class="verdict ${v.cls}">${v.text}</span></div>
        </div>${action}</div>`;
    }
    html += `</div></section>`;

    html += `<section class="section"><h2>我说过的「为什么」</h2><div class="card">`;
    if (!notes.length) html += `<div class="empty-state">打分时写一句话，之后会在这里看到。</div>`;
    for (const n of notes.slice(0, 20)) {
      html += `<div class="quote"><p>“${esc(n.text)}”</p><div class="row-sub"><span>${esc(n.name)}</span><span class="mono">${md(n.date)} · ${n.score} 分</span></div></div>`;
    }
    html += `</div></section>`;
    return html;
  }

  function viewRhythm() {
    let html = header(`<h1 class="week-title">我的一周节奏</h1>
      <p class="lead">这是每一周的起点：固定锚点 2–3 个、弹性 1–2 个，至少留一个晚上什么都不安排。改动会用在之后新开始的每一周。</p>`, "模板");

      <button class="ghost ${armedApply ? "armed" : ""}" data-act="apply-tpl">${armedApply ? "确认：用模板重置本周" : "用模板重置本周（已打分的保留）"}</button></div></section>`;

    html += `<section class="section"><button class="nav-row" data-act="open-settings">

      <span class="nav-row-chev" aria-hidden="true">›</span></button></section>`;

  }

  function viewSettings() {

      <div class="btn-row"><button class="ghost" data-act="make-backup">生成备份</button>

      <div class="btn-row">
        <button class="ghost ${ui.armed === "import" ? "armed" : ""}" data-act="import">${ui.armed === "import" ? "确认导入（会覆盖现在的数据）" : "从上面导入"}</button>

    return html;
  }

  function scoredCount(s) {
    let n = 0;
    Object.values(s.weeks || {}).forEach((w) => w.days.forEach((d) => d.forEach((e) => { if (e.score) n++; })));
    return n;
  }

  function viewAccount() {
    const backLabel = { week: "本周", menu: "菜单", review: "回顾", rhythm: "节奏", settings: "设置" }[ui.prevTab] || "返回";
    let html = `<header class="top">
      <div class="brand"><button class="back-btn" data-act="close-account">‹ ${backLabel}</button><span class="brand-sub">账号</span></div>
      <h1 class="week-title">${cloud.user ? "我的账号" : "登录，让记录跟着你走"}</h1>

    </header>`;

    if (cloud.failed) {
      html += `<div class="banner plan"><span>暂时连不上云端服务，登录和同步用不了。其他功能都能照常使用，记录会保存在这台设备上；记得偶尔去「设置 → 备份与恢复」存一份。</span></div>`;

      html += `<div class="banner sample"><span>正在连接云端…</span></div>`;

          <input class="field" id="auth-pass" type="password" autocomplete="${reg ? "new-password" : "current-password"}" placeholder="${reg ? "设置密码（至少 6 位）" : "密码"}" value="${esc(ui.authPass)}" required>
          <button class="primary" type="submit" ${busy ? "disabled" : ""}>${ui.authBusy ? "请稍候…" : reg ? "注册并登录" : "登录"}</button>

        ${!reg ? `<button class="link-btn" data-act="forgot-pass">忘记密码？</button>` : ""}

      </div>
      <p class="lead" style="margin-top:14px">不登录也可以继续用，记录只存在这个浏览器里。第一次登录时，这台设备上的记录会一起带上云端。</p>`;
      return html;
    }

    const u = cloud.user;
    html += `<div class="auth-card">
      <div class="kv"><span class="row-sub">登录账号</span><b>${esc(u.email || u.displayName || "已登录")}</b></div>
      <div class="kv"><span class="row-sub">云端同步</span><b>${syncBadge()}</b></div>
      ${cloud.errorText ? `<p class="error-line" role="alert">${esc(cloud.errorText)}</p>` : ""}
      <div class="btn-row"><button class="ghost go" data-act="sync-now">立即同步</button></div>
    </div>`;

    if (cloud.conflict) {
      const r = cloud.conflict.remote;
      const armed = ui.armed === "keep-local";
      html += `<section class="section"><h2>保留哪一份记录？</h2>
        <p class="lead">这个账号在云端已经有记录，这台设备上也有一份。选一份保留，另一份会被覆盖。</p>
        <div class="choice">
          <button class="nav-row" data-act="keep-cloud"><span class="nav-row-main"><span class="nav-row-title">用云端的记录</span>
            <span class="row-sub">打过 ${scoredCount(r)} 次分 · 推荐</span></span><span class="nav-row-chev" aria-hidden="true">›</span></button>
          <button class="nav-row" data-act="keep-local"><span class="nav-row-main"><span class="nav-row-title">${armed ? "再点一次：用这台设备的记录覆盖云端" : "用这台设备的记录"}</span>
            <span class="row-sub">打过 ${scoredCount(state)} 次分</span></span><span class="nav-row-chev" aria-hidden="true">›</span></button>
        </div></section>`;
    }

    const armedOut = ui.armed === "logout";
    html += `<section class="section"><div class="btn-row">
      <button class="danger-link" data-act="logout">${armedOut ? "再点一次：退出（这台设备上的记录会清除，云端的保留）" : "退出登录"}</button></div></section>`;
    return html;
  }

  /* ================= cloud sync ================= */
  function hasOwnData(s) {
    const scored = Object.entries(s.weeks).some(([k, w]) => !(s.sampleWeeks || []).includes(k) && w.days.some((d) => d.some((e) => e.score)));
    const defaultIds = DEFAULT_ACTS.map((a) => a[0]);
    const customActs = s.acts.some((a) => !defaultIds.includes(a.id) || a.hidden);
    const customTpl = JSON.stringify(s.template) !== JSON.stringify(DEFAULT_TEMPLATE);
    return scored || customActs || customTpl;
  }

  const AUTH_ERRORS = {
    "auth/invalid-email": "邮箱格式不对，检查一下吧",
    "auth/missing-email": "先填一下邮箱",
    "auth/missing-password": "先填一下密码",
    "auth/weak-password": "密码太短了，至少 6 位",
    "auth/email-already-in-use": "这个邮箱已经注册过了，直接登录就好",
    "auth/invalid-credential": "邮箱或密码不对",
    "auth/wrong-password": "邮箱或密码不对",
    "auth/user-not-found": "还没有用这个邮箱注册过",
    "auth/too-many-requests": "尝试次数太多了，过一会儿再试",
    "auth/network-request-failed": "网络连接失败，检查网络后再试",
    "auth/popup-closed-by-user": "登录窗口被关掉了，再试一次吧",
    "auth/cancelled-popup-request": "登录窗口被关掉了，再试一次吧",
    "auth/unauthorized-domain": "这个网址还没加入 Firebase 的授权域名（Authentication → Settings → Authorized domains）",
    "auth/operation-not-allowed": "这种登录方式还没在 Firebase 里开启（Authentication → Sign-in method）",
  };
  const authMessage = (e) => AUTH_ERRORS[e && e.code] || `出了点问题：${(e && (e.code || e.message)) || "未知错误"}`;

  // Resolves or rejects like p, but rejects with { code } after ms if p is still pending.
  function withTimeout(p, ms, code) {
    let t;
    return Promise.race([p, new Promise((_, reject) => { t = setTimeout(() => reject({ code }), ms); })]).finally(() => clearTimeout(t));
  }

  const cloud = {
    ready: false, failed: false, user: null, conflict: null,
    status: "idle", errorText: "", fb: null, unsub: null, timer: null, loaded: false,

    async init() {
      const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
      try {
        const [appM, authM, fsM] = await withTimeout(Promise.all([
          import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js"),
        ]), 8000, "cloud/timeout");
        const app = appM.initializeApp(FIREBASE_CONFIG);
        this.fb = { ...authM, ...fsM, auth: authM.getAuth(app), db: fsM.getFirestore(app) };
      } catch (e) {
        this.failed = true;
        if (ui.tab === "account") render();
        return;
      }
      this.ready = true;
      if (ui.tab === "account") render();
      this.fb.onAuthStateChanged(this.fb.auth, (user) => this.onUser(user));
      window.addEventListener("online", () => { this.updateBadges(); this.schedulePush(); });
      window.addEventListener("offline", () => this.updateBadges());
    },

    onUser(user) {
      if (this.unsub) { this.unsub(); this.unsub = null; }
      this.user = user; this.conflict = null; this.loaded = false; this.errorText = "";
      if (user) {
        this.setStatus("busy");
        clearTimeout(this.loadTimer);
        this.loadTimer = setTimeout(() => {
          if (this.user !== user || this.loaded) return;
          this.errorText = "连不上云端数据库，记录先保存在这台设备上，联网顺畅后会自动同步";
          this.setStatus("err"); if (ui.tab === "account") render();
        }, 12000);
        const ref = this.fb.doc(this.fb.db, "users", user.uid);
        this.unsub = this.fb.onSnapshot(ref, (snap) => this.onRemote(snap), (err) => {
          this.errorText = err.code === "permission-denied" ? "云端拒绝了访问：请检查 Firestore 的安全规则是否已发布" : authMessage(err);
          this.setStatus("err"); render();
        });
      }
      ui.authBusy = false;
      render();
    },

    onRemote(snap) {
      if (snap.metadata.hasPendingWrites) return;
      const uid = this.user.uid;
      this.loaded = true;
      if (this.errorText.startsWith("连不上云端数据库")) this.errorText = "";
      if (!snap.exists()) {
        state.owner = uid; save(false); this.push(); render(); return;
      }
      let remote;
      try { remote = JSON.parse(snap.data().data); } catch (e) { this.errorText = "云端的数据读不出来"; this.setStatus("err"); return; }
      const remoteAt = snap.data().updatedAt || 0;
      if (state.owner !== uid) {
        if (!hasOwnData(state) || scoredCount(state) === 0 && JSON.stringify(state.template) === JSON.stringify(remote.template)) {
          this.adopt(remote, remoteAt);
        } else {
          this.conflict = { remote, remoteAt };
          this.setStatus("idle"); render();
        }
        return;
      }
      if (remoteAt > (state.updatedAt || 0)) this.adopt(remote, remoteAt);
      else if (remoteAt < (state.updatedAt || 0)) this.push();
      else this.setStatus("ok");
    },

    adopt(remote, remoteAt) {
      normalize(remote);
      remote.owner = this.user.uid;
      remote.updatedAt = remoteAt;
      this.conflict = null;
      if (ui.sheet) { this.pending = [remote, remoteAt]; return; }
      state = remote; save(false);
      this.setStatus("ok"); render();
    },

    applyPending() {
      if (!this.pending || ui.sheet) return;
      const [remote, remoteAt] = this.pending; this.pending = null;
      if (remoteAt > (state.updatedAt || 0)) { state = remote; save(false); this.setStatus("ok"); }
    },

    canPush() { return this.ready && this.user && this.loaded && !this.conflict && state.owner === this.user.uid; },

    schedulePush() {
      if (!this.canPush()) return;
      clearTimeout(this.timer);
      this.setStatus("busy");
      this.timer = setTimeout(() => this.push(), 1200);
    },

    async push() {
      if (!this.canPush()) return;
      clearTimeout(this.timer);
      if (!state.updatedAt) state.updatedAt = Date.now();
      const at = state.updatedAt;
      this.setStatus("busy");
      try {
        const { owner, ...data } = state;
        await this.fb.setDoc(this.fb.doc(this.fb.db, "users", this.user.uid), { data: JSON.stringify(data), updatedAt: at });
        this.errorText = "";
        if (state.updatedAt === at) this.setStatus("ok");
      } catch (err) {
        this.errorText = err.code === "permission-denied" ? "云端拒绝了写入：请检查 Firestore 的安全规则是否已发布" : authMessage(err);
        this.setStatus("err");
        if (ui.tab === "account") render();
      }
    },

    setStatus(st) { this.status = st; this.updateBadges(); },
    statusView() {
      if (!this.user) return ["", "未登录"];
      if (this.conflict) return ["busy", "等你选择保留哪份记录"];
      if (!navigator.onLine) return ["", "离线 · 联网后自动同步"];
      return { ok: ["ok", "已同步"], busy: ["busy", "同步中…"], err: ["err", "同步失败"], idle: ["", "已连接"] }[this.status] || ["", "已连接"];
    },
    updateBadges() {
      document.querySelectorAll(".sync-slot").forEach((el) => {
        const [cls, text] = this.statusView();
        el.innerHTML = `<i class="sync-dot ${cls}"></i>${esc(text)}`;
      });
    },
  };

  /* ================= sheet ================= */
  function openEntrySheet(mode, day, idx) {
    const src = mode === "entry" ? ensureWeek(ui.week).days[day][idx] : state.template[day][idx];
    ui.sheet = { mode, day, idx, picking: false, draft: { kind: src.kind, act: src.act || null, score: src.score ?? null, note: src.note || "" } };
    if (src.kind === "flex" && !src.act) ui.sheet.picking = true;
    ui.armed = null;
    render();
  }

  function renderSheet() {
    const s = ui.sheet;
    if (!s) { $sheet.innerHTML = ""; return; }
    if (s.mode === "promote") { $sheet.innerHTML = promoteSheet(s); return; }
    const d = s.draft;
    const isEntry = s.mode === "entry";
    const date = isEntry ? addDays(parseKey(ui.week), s.day) : null;
    const act = d.act ? actById(d.act) : null;
    const { map } = collect();

    let html = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="编辑">
      <div class="grab"></div>
      <div class="sheet-head"><h2>${DAYS[s.day]}${isEntry ? "" : " · 每周模板"}</h2>${date ? `<span class="row-sub">${md(date)}</span>` : ""}</div>
      <div class="seg" role="group" aria-label="类型">${Object.entries(KINDS).map(([k, v]) => `<button data-act="kind" data-kind="${k}" aria-pressed="${d.kind === k}">${v}</button>`).join("")}</div>
      <p class="seg-hint">${KIND_HINT[d.kind]}</p>`;

    if (d.kind !== "blank") {
      html += `<div class="block"><span class="label">做什么</span>
        <div class="current-act ${act ? "" : "none"}">${act ? esc(act.name) : "还没选"}</div>
        <div class="btn-row">
          <button class="ghost" data-act="toggle-pick">${s.picking ? "收起" : d.kind === "anchor" ? "从锚点里挑" : "从菜单挑"}</button>
          <button class="ghost" data-act="random-pick">随机来一个</button>
          ${d.act && !isEntry ? `<button class="ghost" data-act="clear-act">不指定</button>` : ""}
        </div>`;
      if (s.picking) {
        const pick = (a) => {
          const st = actStats(map, a.id);
          return `<button class="pick" data-act="pick" data-id="${a.id}" aria-pressed="${d.act === a.id}"><span>${esc(a.name)}</span>
            <small>${st.n ? `${st.avg.toFixed(1)} 分 · ${st.n} 次` : "没试过"}</small></button>`;
        };
        const group = (c, items) => items.length ? `<div class="cat-head"><i class="dot" style="background:${c.color}"></i>${c.name}</div>${items.map(pick).join("")}` : "";
        html += `<div class="picker">`;
        if (d.kind === "anchor") {
          html += anchorActs().map(pick).join("") || `<div class="empty-state">还没有锚点，先新建一个吧。</div>`;
          html += s.newAnchor
            ? `<div class="new-anchor"><input class="field" id="new-anchor-name" maxlength="60" placeholder="比如：周三瑜伽" value="${esc(s.newAnchorName || "")}">
                <button class="primary" data-act="create-anchor">添加</button></div>`
            : `<button class="pick add-pick" data-act="new-anchor"><span>+ 新建一个锚点</span></button>`;
          html += `<button class="pick add-pick" data-act="toggle-from-menu"><span>${s.fromMenu ? "− 收起菜单" : "+ 从菜单里选一个"}</span></button>`;
          if (s.fromMenu) {
            html += `<p class="seg-hint" style="margin:0 0 4px">选中并保存后，它会成为锚点。</p>`;
            for (const c of CATS) html += group(c, menuActs().filter((a) => a.cat === c.id));
          }
        } else {
          for (const c of [...CATS.slice(1), CATS[0]]) html += group(c, state.acts.filter((a) => a.cat === c.id && !a.hidden));
        }
        html += `</div>`;
      }
      html += `</div>`;
    }

    if (isEntry) {
      html += `<div class="block"><span class="label">做完之后我有多开心？</span>
        <div class="scores">${[1, 2, 3, 4, 5].map((n) => `<button class="score" data-act="score" data-n="${n}" aria-pressed="${d.score === n}"><b>${n}</b><span>${SCORE_WORDS[n]}</span></button>`).join("")}</div>
        <input class="field" id="entry-note" placeholder="一句话：为什么？" maxlength="120" value="${esc(d.note)}">
        ${d.score ? `<div><button class="ghost" data-act="clear-score">清除打分</button></div>` : ""}
      </div>`;
    }

    const armed = ui.armed === "del-entry";
    html += `<div class="sheet-foot">
        <button class="danger-link" data-act="del-entry">${armed ? "再点一次确认删除" : "删除这一项"}</button>
        <div class="btn-row"><button class="ghost" data-act="close-sheet-btn">取消</button><button class="primary" data-act="save-entry">保存</button></div>
      </div></div></div>`;
    $sheet.innerHTML = html;
  }

  function promoteSheet(s) {
    const a = actById(s.id);
    return `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="设为锚点">
      <div class="grab"></div>
      <div class="sheet-head"><h2>把它变成锚点</h2></div>
      <p class="lead">「${esc(a?.name)}」固定在每周哪一天？</p>
      <div class="day-grid">${DAYS.map((n, i) => `<button data-act="promote-day" data-day="${i}">${n.slice(1)}</button>`).join("")}</div>
      <div class="sheet-foot"><span></span><button class="ghost" data-act="close-sheet-btn">取消</button></div>
    </div></div>`;
  }

  /* ================= actions ================= */
  let toastTimer;
  function toast(msg) {
    $toast.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $toast.innerHTML = ""; }, 2200);
  }
  function arm(token) {
    if (ui.armed === token) { ui.armed = null; return true; }
    ui.armed = token; render(); return false;
  }
  function randomAct(kind, current) {
    const w = ensureWeek(ui.week).days.flat().map((e) => e.act);
    let pool = (kind === "anchor" ? anchorActs() : menuActs()).filter((a) => a.id !== current);
    const fresh = pool.filter((a) => !w.includes(a.id));
    if (fresh.length) pool = fresh;
    return pool.length ? pool[Math.floor(Math.random() * pool.length)].id : current;
  }

  const actions = {
    "week-prev": () => { ui.week = keyOf(addDays(parseKey(ui.week), -7)); },
    "week-next": () => { ui.week = keyOf(addDays(parseKey(ui.week), 7)); },
    "week-now": () => { ui.week = thisWeekKey(); },
    "clear-sample": () => {
      state.sampleWeeks.forEach((k) => delete state.weeks[k]);
      state.sampleWeeks = [];
      save(); toast("示例已清除，从这周开始记录吧");
    },
    "open-entry": (el) => { openEntrySheet("entry", +el.dataset.day, +el.dataset.idx); return false; },
    "add-entry": (el) => {
      const d = ensureWeek(ui.week).days[+el.dataset.day];
      d.push({ id: uid(), kind: "flex", act: null, score: null, note: "" });
      save();
      openEntrySheet("entry", +el.dataset.day, d.length - 1);
      ui.sheet.isNew = true;
      renderSheet();
      return false;
    },
    "open-tpl": (el) => { openEntrySheet("tpl", +el.dataset.day, +el.dataset.idx); return false; },
    "add-tpl": (el) => {
      const d = state.template[+el.dataset.day];
      d.push({ kind: "flex" });
      save();
      openEntrySheet("tpl", +el.dataset.day, d.length - 1);
      ui.sheet.isNew = true;
      renderSheet();
      return false;
    },
    "close-sheet": (el, ev) => { if (ev.target !== el) return false; closeSheet(); },
    "close-sheet-btn": () => closeSheet(),
    kind: (el) => {
      const s = ui.sheet, k = el.dataset.kind;
      s.draft.kind = k; s.newAnchor = false;
      if (k === "blank") s.picking = false;
      // an anchor slot can only hold an anchor; a flex slot may hold anything
      if (k === "anchor" && s.draft.act && !actById(s.draft.act)?.anchor) s.draft.act = null;
      if (k !== "blank" && !s.draft.act) s.picking = true;
      renderSheet(); return false;
    },
    "toggle-from-menu": () => { ui.sheet.fromMenu = !ui.sheet.fromMenu; renderSheet(); return false; },
    "new-anchor": () => { ui.sheet.newAnchor = true; ui.sheet.newAnchorName = ""; renderSheet(); document.getElementById("new-anchor-name")?.focus(); return false; },
    "create-anchor": () => {
      const name = (ui.sheet.newAnchorName || "").trim();
      if (!name) { document.getElementById("new-anchor-name")?.focus(); return false; }
      const a = { id: uid(), name, cat: "rhythm", hidden: false, anchor: true };
      state.acts.push(a); save();
      Object.assign(ui.sheet, { newAnchor: false, newAnchorName: "", picking: false });
      ui.sheet.draft.act = a.id;
      toast("已新建锚点"); renderSheet(); return false;
    },
    "make-anchor": (el) => { const a = actById(el.dataset.id); a.anchor = true; save(); toast(`「${a.name}」已设为锚点`); },
    unanchor: (el) => { const a = actById(el.dataset.id); a.anchor = false; save(); toast(`「${a.name}」不再是锚点`); },
    "toggle-pick": () => { ui.sheet.picking = !ui.sheet.picking; renderSheet(); return false; },
    "random-pick": () => { ui.sheet.draft.act = randomAct(ui.sheet.draft.kind, ui.sheet.draft.act); ui.sheet.picking = false; renderSheet(); return false; },
    "clear-act": () => { ui.sheet.draft.act = null; renderSheet(); return false; },
    pick: (el) => { ui.sheet.draft.act = el.dataset.id; ui.sheet.picking = false; ui.sheet.fromMenu = false; renderSheet(); return false; },
    score: (el) => { ui.sheet.draft.score = +el.dataset.n; renderSheet(); document.getElementById("entry-note")?.focus(); return false; },
    "clear-score": () => { ui.sheet.draft.score = null; renderSheet(); return false; },
    "save-entry": () => {
      const s = ui.sheet, d = s.draft;
      const picked = d.act && actById(d.act);
      if (d.kind === "anchor" && picked && !picked.anchor) { picked.anchor = true; toast(`「${picked.name}」已设为锚点`); }
      if (s.mode === "entry") {
        const e = ensureWeek(ui.week).days[s.day][s.idx];
        Object.assign(e, { kind: d.kind, act: d.kind === "blank" ? null : d.act, score: d.score, note: d.note.trim() });
        if (d.score) toast(d.score >= 4 ? "记下了，这个值得留下" : "记下了");
      } else {
        const t = { kind: d.kind };
        if (d.kind !== "blank" && d.act) t.act = d.act;
        state.template[s.day][s.idx] = t;
        toast("模板已更新，新的一周会用上");
      }
      save(); ui.sheet = null;
    },
    "del-entry": () => {
      if (!arm("del-entry")) { renderSheet(); return false; }
      const s = ui.sheet;
      (s.mode === "entry" ? ensureWeek(ui.week).days[s.day] : state.template[s.day]).splice(s.idx, 1);
      save(); ui.sheet = null;
    },
    "hide-act": (el) => {
      if (!arm("hide:" + el.dataset.id)) return false;
      const a = actById(el.dataset.id); a.hidden = true;
      save(); toast(`已从菜单删掉「${a.name}」`);
    },
    "restore-act": (el) => { actById(el.dataset.id).hidden = false; save(); },
    promote: (el) => { ui.sheet = { mode: "promote", id: el.dataset.id }; },
    "promote-day": (el) => {
      const day = +el.dataset.day, id = ui.sheet.id;
      state.template[day].push({ kind: "anchor", act: id });
      actById(id).anchor = true;
      save(); ui.sheet = null;
      toast(`已设为每${DAYS[day]}的锚点`);
    },
    "apply-tpl": () => {
      if (!arm("apply-tpl")) return false;
      const w = ensureWeek(thisWeekKey());
      const fresh = fromTemplate(state.template);
      w.days = w.days.map((d, i) => [...d.filter((e) => e.score), ...fresh[i]]);
      save(); toast("本周已按模板重置");
    },
    theme: (el) => {
      ui.theme = el.dataset.theme;
      applyTheme(ui.theme);
      try { localStorage.setItem(THEME_KEY, ui.theme); } catch (e) { /* ignore */ }
    },
    "open-account": () => { if (ui.tab !== "account") ui.prevTab = ui.tab; ui.authError = ""; goTab("account"); },
    "close-account": () => goTab(ui.prevTab || "week"),
    "auth-mode": (el) => { ui.authMode = el.dataset.mode; ui.authError = ""; },
    "google-login": () => {
      if (!cloud.ready) return false;
      const { auth, GoogleAuthProvider, signInWithPopup, signInWithRedirect } = cloud.fb;
      const provider = new GoogleAuthProvider();
      ui.authBusy = true; ui.authError = "";
      withTimeout(signInWithPopup(auth, provider), 120000, "auth/network-request-failed").catch((e) => {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider);
        ui.authBusy = false; ui.authError = authMessage(e); render();
      });
    },
    "forgot-pass": () => {
      if (!cloud.ready) return false;
      const email = ui.authEmail.trim();
      if (!email) { ui.authError = "先在上面填好邮箱，再点「忘记密码」"; return; }
      withTimeout(cloud.fb.sendPasswordResetEmail(cloud.fb.auth, email), 15000, "auth/network-request-failed")
        .then(() => { ui.authError = ""; toast("重设密码的邮件已发出，去邮箱看看"); render(); })
        .catch((e) => { ui.authError = authMessage(e); render(); });
    },
    "sync-now": () => { cloud.push(); return false; },
    "keep-cloud": () => { const c = cloud.conflict; cloud.adopt(c.remote, c.remoteAt); toast("已换成云端的记录"); },
    "keep-local": () => {
      if (!arm("keep-local")) return false;
      cloud.conflict = null; state.owner = cloud.user.uid; save(); toast("已用这台设备的记录覆盖云端");
    },
    logout: () => {
      if (!arm("logout")) return false;
      cloud.fb.signOut(cloud.fb.auth).then(() => {
        state = freshState(); seedSample(state); save(false);
        ui.week = thisWeekKey(); ui.backup = ""; ui.authPass = "";
        toast("已退出，云端的记录都还在"); render();
      });
      return false;
    },
    "open-settings": () => goTab("settings"),
    "close-settings": () => goTab("rhythm"),
    "make-backup": () => { ui.backup = JSON.stringify(state); },
    "copy-backup": () => {
      const ta = document.getElementById("backup-out");
      const fallback = () => { ta.focus(); ta.select(); toast("已选中，请手动复制"); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ui.backup).then(() => toast("已复制备份"), fallback);
      else fallback();
      return false;
    },
    import: () => {
      const text = document.getElementById("backup-in").value.trim();
      if (!text) { toast("先把备份粘贴到输入框里"); return false; }
      if (!arm("import")) { document.getElementById("backup-in").value = text; return false; }
      importText(text);
    },
    reset: () => {
      if (!arm("reset")) return false;
      const owner = state.owner;
      state = freshState(); state.owner = owner; save(); ui.week = thisWeekKey(); ui.backup = ""; toast("已清空，从头开始");
    },
  };

  function importText(text) {
    try {
      const s = JSON.parse(text);
      if (!s || !Array.isArray(s.acts) || !Array.isArray(s.template) || typeof s.weeks !== "object") throw new Error();
      normalize(s);
      s.owner = state.owner;
      state = s; save(); ui.week = thisWeekKey(); toast("导入成功");
    } catch (e) {
      toast("导入失败：这不是有效的备份内容");
    }
    render();
  }

  function goTab(t) {
    ui.tab = t; ui.armed = null;
    try { history.replaceState(null, "", "#" + t); } catch (e) { /* ignore */ }
    window.scrollTo(0, 0);
  }

  function closeSheet() {
    const s = ui.sheet;
    if (s && s.isNew) {
      // a newly added item that was never saved is discarded
      const list = s.mode === "entry" ? ensureWeek(ui.week).days[s.day] : state.template[s.day];
      list.splice(s.idx, 1); save();
    }
    ui.sheet = null; ui.armed = null;
    cloud.applyPending();
  }

  document.addEventListener("click", (ev) => {
    const tab = ev.target.closest(".tab");
    if (tab) {
      goTab(tab.dataset.tab); render(); return;
    }
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const name = el.dataset.act;
    const fn = actions[name];
    if (!fn) return;
    const keepArm = ["del-entry", "hide-act", "apply-tpl", "import", "reset", "keep-local", "logout"].includes(name);
    if (!keepArm) ui.armed = null;
    const res = fn(el, ev);
    if (res !== false) render();
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "entry-note" && ui.sheet) ui.sheet.draft.note = ev.target.value;
    if (ev.target.id === "new-anchor-name" && ui.sheet) ui.sheet.newAnchorName = ev.target.value;
    if (ev.target.id === "auth-email") ui.authEmail = ev.target.value;
    if (ev.target.id === "auth-pass") ui.authPass = ev.target.value;
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && ui.sheet) { closeSheet(); render(); }
    if (ev.key === "Enter" && ev.target.id === "new-anchor-name") { ev.preventDefault(); actions["create-anchor"](); return; }
    if (ev.key === "Enter" && ev.target.id === "entry-note") { ev.preventDefault(); actions["save-entry"](); render(); }
  });
  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "auth-form") {
      ev.preventDefault();
      if (!cloud.ready || ui.authBusy) return;
      const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = cloud.fb;
      const email = ui.authEmail.trim(), pass = ui.authPass;
      if (!email || !pass) { ui.authError = !email ? "先填一下邮箱" : "先填一下密码"; render(); return; }
      const fn = ui.authMode === "register" ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
      ui.authBusy = true; ui.authError = ""; render();
      withTimeout(fn(auth, email, pass), 15000, "auth/network-request-failed").then(() => { ui.authPass = ""; toast(ui.authMode === "register" ? "注册成功，已开启云端同步" : "登录成功"); })
        .catch((e) => { ui.authBusy = false; ui.authError = authMessage(e); render(); });
      return;
    }
    if (ev.target.id !== "add-form") return;
    ev.preventDefault();
    const name = document.getElementById("new-act-name").value.trim();
    const cat = document.getElementById("new-act-cat").value;
    if (!name) return;
    state.acts.push({ id: uid(), name, cat, hidden: false, anchor: cat === "rhythm" });
    save(); toast(cat === "rhythm" ? "已加入「日常节奏」，也是一个锚点" : `已加入「${catById(cat).name}」`); render();
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id !== "backup-file") return;
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importText(String(r.result));
    r.readAsText(f);
  });

  save(false);
  render();
  cloud.init();
})();
</script>
</body>
</html>
